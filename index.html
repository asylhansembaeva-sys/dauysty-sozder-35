<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дауысты дыбыстан басталатын 3 әріптен тұратын сөздерді оқы</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:linear-gradient(#45c5fa 0%,#a9eaff 46%,#b5ef75 78%,#64ca38 100%);min-height:100vh;padding:14px;color:#102e58}main{max-width:1350px;margin:auto}.heading{background:#fffde9;border:6px solid #f5c543;border-radius:45px;padding:12px 20px;text-align:center;box-shadow:0 6px 0 #0001}h1{font-size:clamp(26px,3.6vw,49px);line-height:1.15;margin:0;color:#114382;font-weight:900}.note{text-align:center;font-size:clamp(20px,2.4vw,29px);font-weight:bold;margin:13px}.bar{display:flex;justify-content:center;align-items:center;gap:20px;margin:12px;font-size:23px;font-weight:bold}.bar button{background:#fff;border:2px solid #15559b;border-radius:14px;padding:8px 14px;font:bold 21px 'Times New Roman';cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.tile{font:bold clamp(29px,4vw,58px) 'Times New Roman';height:90px;border:5px solid;border-radius:22px;cursor:pointer;color:#000;box-shadow:0 6px 0 #0002;transition:opacity .2s,transform .2s}.tile:nth-child(5n+1){background:#ffe2ee;border-color:#ff70b7}.tile:nth-child(5n+2){background:#fff7bb;border-color:#ffcf42}.tile:nth-child(5n+3){background:#e0ffd4;border-color:#a5d878}.tile:nth-child(5n+4){background:#d7f3ff;border-color:#5ac5f3}.tile:nth-child(5n){background:#eee0ff;border-color:#c18bf0}.tile.gone{opacity:0;transform:scale(.7);pointer-events:none}.overlay{position:fixed;inset:0;background:#18384bb9;display:grid;place-items:center;padding:20px}.overlay.hidden{display:none}.panel{background:#fffce9;border:7px solid #f5c543;border-radius:30px;padding:30px;max-width:650px;text-align:center}.panel h2{font-size:clamp(34px,5vw,55px);color:#124282}.panel p{font-size:28px}.primary{background:#f13b3b;border:0;border-radius:18px;padding:15px 35px;color:#fff;font:bold 36px 'Times New Roman';cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr);gap:7px}.tile{height:73px;border-width:3px}.heading{border-radius:25px}.bar{font-size:18px}}
</style></head><body><main><div class="heading"><h1>ДАУЫСТЫ ДЫБЫСТАН БАСТАЛАТЫН<br>3 ӘРІПТЕН ТҰРАТЫН СӨЗДЕРДІ ОҚЫ</h1></div><p class="note">Сөзді оқы да, үстін бас — сөз жоғалады!</p><div class="bar"><span id="counter">Оқылғаны: 0 / 35</span><button id="again">ҚАЙТА БАСТАУ</button></div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="heading2">СӨЗДЕРДІ ОҚЫ!</h2><p id="hint">35 сөзді оқып, әрқайсысын бас!</p><button class="primary" id="start">БАСТА!</button></div></div><script>
const words=['ана','ара','ала','аса','ата','аза','алу','ару','ант','асу','ату','ора','ота','осу','оны','ұлу','ұлы','ұрт','ұшу','еру','езу','ену','елу','оқы','ору','ұту','ашу','аты','есу','аша','ашы','ұна','ұза','озу','оба'];const grid=document.getElementById('grid'),counter=document.getElementById('counter'),overlay=document.getElementById('overlay'),start=document.getElementById('start');let done=0;
function reset(){done=0;counter.textContent='Оқылғаны: 0 / '+words.length;grid.innerHTML='';words.forEach(w=>{let b=document.createElement('button');b.className='tile';b.textContent=w;b.onclick=()=>{if(b.classList.contains('gone'))return;b.classList.add('gone');b.disabled=true;done++;counter.textContent='Оқылғаны: '+done+' / '+words.length;if(done===words.length)setTimeout(()=>{document.getElementById('heading2').textContent='ЖАРАЙСЫҢ!';document.getElementById('hint').textContent='Барлық 35 сөзді оқыдың!';start.textContent='ҚАЙТА ОЙНАУ';start.onclick=()=>{reset();overlay.classList.add('hidden')};overlay.classList.remove('hidden')},300)};grid.appendChild(b)})}
function welcome(){document.getElementById('heading2').textContent='СӨЗДЕРДІ ОҚЫ!';document.getElementById('hint').textContent='35 сөзді оқып, әрқайсысын бас!';start.textContent='БАСТА!';start.onclick=()=>overlay.classList.add('hidden');overlay.classList.remove('hidden')}
document.getElementById('again').onclick=()=>{reset();welcome()};reset();welcome();
</script></body></html>
